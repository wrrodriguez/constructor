version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: constructor
      POSTGRES_PASSWORD: constructor_dev
      POSTGRES_DB: constructor_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U constructor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_dev_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev_password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-api:
    build:
      context: ./services/platform-api
      target: development
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://constructor:constructor_dev@postgres:5432/constructor_dev
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      ENVIRONMENT: development
      INTERNAL_SECRET: internal_dev_secret
    volumes:
      - ./services/platform-api:/app
      - ./keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  agent-orchestration:
    build:
      context: ./services/agent-orchestration
      target: development
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://constructor:constructor_dev@postgres:5432/constructor_dev
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      USE_STUB_MODEL: ${USE_STUB_MODEL:-false}
      ENVIRONMENT: development
    volumes:
      - ./services/agent-orchestration:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.worker

  websocket-service:
    build:
      context: ./services/websocket-service
      target: development
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://constructor:constructor_dev@postgres:5432/constructor_dev
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      ENVIRONMENT: development
    volumes:
      - ./services/websocket-service:/app
      - ./keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.worker

  scheduler-service:
    build:
      context: ./services/scheduler-service
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      platform-api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://constructor:constructor_dev@postgres:5432/constructor_dev
      REDIS_URL: redis://:redis_dev_password@redis:6379/0
      PLATFORM_API_URL: http://platform-api:8000
      INTERNAL_SECRET: internal_dev_secret
      POLL_INTERVAL_SECONDS: "30"
    restart: unless-stopped

volumes:
  postgres_data:
